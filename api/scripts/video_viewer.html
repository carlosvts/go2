<!doctype html>
<!--
  Visualizador do /ws/video (F-003): ferramenta de lab, só para ver.
  Não tem nenhum controle do robô.

  Abra o arquivo no navegador, ajuste a URL e clique em "conectar".
  video_viewer.html#auto conecta ao abrir (#auto=ws://IP:8000/ws/video).

  Regra de uso: avise as pessoas no lab antes de ligar o vídeo.
  Formato do frame: specs/contracts/ws-video.md.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeo Go2</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: #111; color: #ddd; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: #1b1b1b; }
  header input { width: 320px; max-width: 100%; }
  main { padding: 16px; }
  #frame { display: block; max-width: 100%; background: #000; min-height: 240px; }
  #stats { margin-top: 8px; font-variant-numeric: tabular-nums; }
  .pill { padding: 2px 8px; border-radius: 10px; background: #333; }
  .ok { background: #1f5130; } .wait { background: #5a4b16; } .bad { background: #6b1f1f; }
  #hint { margin-top: 8px; color: #f2c46d; min-height: 1.4em; }
</style>
</head>
<body>
<header>
  <input id="url" type="text" value="ws://localhost:8000/ws/video">
  <button id="connect">conectar</button>
  <span>conexão: <span id="conn" class="pill">—</span></span>
  <span>vídeo: <span id="video" class="pill">—</span></span>
</header>
<main>
  <img id="frame" alt="quadro da câmera do Go2">
  <div id="stats">sem quadros</div>
  <div id="hint"></div>
</main>
<script>
"use strict";
const HEADER_LEN = 32;
const $ = (id) => document.getElementById(id);
let ws = null;
let lastSeq = null;
let gaps = 0;
let windowFrames = 0;
let windowBytes = 0;
let windowStart = performance.now();
let resolution = "—";

const HINTS = {
  starting: "Câmera pedida ao robô; esperando o primeiro quadro.",
  stalled: "Sem quadros da câmera. Feche e reconecte o visualizador; se continuar, confira o log da api (video_metrics).",
  disconnected: "Robô fora do ar: o visualizador espera a conexão voltar.",
  reconnecting: "A api está reconectando ao robô.",
};

function setPill(id, state, cls) {
  const el = $(id);
  el.textContent = state;
  el.className = "pill " + cls;
}

function onText(text) {
  const msg = JSON.parse(text);
  const state = msg.data.state;
  if (msg.topic === "connection") {
    setPill("conn", state, state === "connected" ? "ok" : "bad");
    if (state !== "connected") {
      setPill("video", "—", "");
      $("hint").textContent = HINTS[state] || "";
    } else {
      $("hint").textContent = "";
    }
  } else if (msg.topic === "video") {
    setPill("video", state, state === "streaming" ? "ok" : state === "starting" ? "wait" : "bad");
    $("hint").textContent = HINTS[state] || "";
  }
}

function onFrame(buf) {
  const view = new DataView(buf);
  const version = view.getUint8(0);
  if (version !== 1) return; // versão desconhecida: descarta
  const headerLen = view.getUint16(2, true);
  const seq = view.getUint32(4, true);
  const width = view.getUint16(16, true);
  const height = view.getUint16(18, true);
  const jpegLen = view.getUint32(20, true);
  if (lastSeq !== null) gaps += ((seq - lastSeq - 1) >>> 0);
  lastSeq = seq;
  resolution = width + "×" + height;
  windowFrames += 1;
  windowBytes += buf.byteLength;
  const blob = new Blob([new Uint8Array(buf, headerLen, jpegLen)], { type: "image/jpeg" });
  const img = $("frame");
  const old = img.src;
  img.src = URL.createObjectURL(blob);
  if (old.startsWith("blob:")) URL.revokeObjectURL(old);
}

setInterval(() => {
  const now = performance.now();
  const elapsed = (now - windowStart) / 1000;
  if (elapsed <= 0) return;
  const fps = windowFrames / elapsed;
  const kib = windowFrames ? windowBytes / windowFrames / 1024 : 0;
  $("stats").textContent = windowFrames
    ? `${fps.toFixed(1)} frames/s | ${resolution} | ${kib.toFixed(1)} KiB/quadro | seq ${lastSeq} | buracos no seq: ${gaps}`
    : "sem quadros";
  windowFrames = 0;
  windowBytes = 0;
  windowStart = now;
}, 1000);

function connect(url) {
  if (ws) ws.close();
  lastSeq = null;
  gaps = 0;
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  setPill("conn", "abrindo…", "wait");
  ws.onmessage = (event) => {
    if (typeof event.data === "string") onText(event.data);
    else onFrame(event.data);
  };
  ws.onclose = (event) => {
    setPill("conn", "fechado " + event.code + (event.reason ? " " + event.reason : ""), "bad");
    setPill("video", "—", "");
    const reasons = {
      1013: "Limite de clientes atingido (GO2_VIDEO_MAX_CLIENTS). Tente mais tarde.",
      1011: "A api não conseguiu ligar a câmera. Reconectar tenta de novo.",
      1001: "A api está desligando. Reconecte quando ela voltar.",
    };
    $("hint").textContent = reasons[event.code] || "WebSocket fechado.";
  };
}

$("connect").onclick = () => connect($("url").value);

// video_viewer.html#auto conecta ao abrir; #auto=ws://ip:8000/ws/video troca a URL.
if (location.hash.startsWith("#auto")) {
  const custom = location.hash.split("=")[1];
  if (custom) $("url").value = decodeURIComponent(custom);
  connect($("url").value);
}
</script>
</body>
</html>
