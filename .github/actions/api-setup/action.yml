name: Setup da api
description: Dependências de sistema, uv e ambiente do projeto em api/

inputs:
  python-version:
    description: Versão do Python (padrão do api/.python-version se omitida)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # O pyaudio (dependência de unitree-webrtc-connect) compila contra o PortAudio.
    - name: Instalar PortAudio
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends portaudio19-dev
    # A lib importa `sounddevice`, que inicia o PortAudio no import. No Ubuntu 26.04
    # (ubuntu-latest desde nov/2026) o PortAudio 19.7 tem backend PulseAudio e o
    # import falha sem servidor ("PulseAudio_Initialize: Can't connect to server").
    # Um servidor PulseAudio sem placa de som basta; os testes não tocam áudio.
    - name: Servidor PulseAudio para o import do sounddevice
      shell: bash
      run: |
        sudo apt-get install --yes --no-install-recommends pulseaudio
        pulseaudio --check || pulseaudio --daemonize --exit-idle-time=-1
        pulseaudio --check
    - uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}
        working-directory: api
    - name: Instalar dependências
      shell: bash
      working-directory: api
      run: uv sync
