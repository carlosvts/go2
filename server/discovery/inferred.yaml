# Tudo neste arquivo é INFERIDO: não veio da go2-api nem de phrases.json.
# Revise, edite aqui (ou em phrases.json) e rode:
#
#   uv run python scripts/build_catalog.py
#
# Comandos e rotas estão em capabilities.json (da go2-api); frases e
# velocidades, em commands.json e phrases.json, ao lado deste arquivo.

# Quanto a fila espera depois de enviar cada comando, em segundos. A go2-api
# responde 202 na hora e não avisa o fim do gesto/postura, então este tempo é o
# único "fim" que o servidor conhece. REVISAR TODOS com o robô.
durations:
  stand_up: 3.0
  stand_down: 3.0
  sit: 3.0
  rise_sit: 3.0
  balance_stand: 1.5
  recovery_stand: 4.0
  damp: 2.0
  hello: 5.0
  stretch: 6.0
  finger_heart: 6.0
  wiggle_hips: 6.0
  content: 6.0
  dance1: 10.0
  dance2: 10.0
  scrape: 6.0
  pose: 5.0

# Variações de fala além das frases de phrases.json. Entram como exemplos para o
# vizinho mais próximo por embeddings.
extra_examples:
  stand_up: [levantar, levante, fica de pé, ficar de pé, vamos levantar]
  # "santar": o Whisper ouviu assim um "senta!" na sessão de 2026-11-04.
  sit: [sentar, sente, sente-se, vamos sentar, santar]
  stand_down: [deitar, deite, deite-se, pode deitar, vamos deitar]
  hello: [cumprimenta, acenar, acena, dá um oi, dar tchau, olá, dá oi, dar oi]
  stretch: [alongar, alongue, se alonga, espreguiçar, se espreguiça]
  finger_heart: [faz um coração, fazer coração, coraçãozinho]
  damp: [desligar os motores, desliga os motores, desligue os motores]

# Parada além das palavras de phrases.json (para, pare, parar, stop). Parar por
# engano é seguro; deixar de parar não é. Só por cláusula EXATA (depois de tirar
# enchimento) ou por prefixo; não entram no índice de embeddings, para não
# puxar gestos para a parada.
stop:
  # A cláusula inteira é uma destas.
  phrases:
    - chega
    - já chega
    - basta
    - para tudo
    - pare tudo
    - para já
    - pare já
    - para com isso
    - para o robô
    - pare o robô
    - para o movimento
    - fica quieto
    - fique quieto
    - quieto
    - espera
    - calma
    - freia
    - segura
    - cancela
    - cancelar
    - cancela tudo
    - interrompe
    - emergência
    - socorro
    # O Whisper às vezes ouve "para" assim.
    - paro
    - parei
  # A cláusula começa por um destes ("para de andar pra frente", "pare com a dança").
  prefixes: [para de, pare de, parar de, para com, pare com]

# Aceitos só por frase exata (depois de normalizar), nunca por embedding.
# `damp` tira a força dos motores: de pé, o robô cai.
lexical_only: [damp]

# Comandos que a go2-api aceita, sem frase em phrases.json, HABILITADOS com
# frases inferidas. As frases e a duração continuam INFERIDAS: o catálogo as
# marca assim, e nada aqui foi conferido com o robô.
enabled_inferred:
  rise_sit: [levanta do sentado, levantar do sentado, sair do sentado, sai do sentado]
  balance_stand: [modo equilíbrio, fica em equilíbrio, fique em equilíbrio, se equilibra]
  recovery_stand: [recuperar, recupera, se recupera, recupera a postura]
  wiggle_hips: [rebola, rebolar, rebole, mexe o quadril]
  # "dança" sem número aponta para a dança 1 (decisão da equipe); a dança 2 só
  # com o número ou "segunda".
  dance1: [dança, dançar, dance, dança um, dança 1, primeira dança, dança número um, vamos dançar]
  dance2: [dança dois, dança 2, segunda dança, dança número dois]
  scrape: [arranha, arranhar o chão, arranha o chão]

# Comandos que a go2-api aceita e para os quais phrases.json não tem frase. Entram
# no catálogo DESABILITADOS: servem de distrator (quem pedir "pose" é
# rejeitado em vez de cair no comando parecido mais próximo). Para habilitar
# um, passe-o para `enabled_inferred` depois de revisar os exemplos e a duração.
disabled:
  content: [fica feliz, feliz]
  pose: [pose, faz uma pose]

movement:
  # Nome de cada combinação verbo × direção. Os verbos, as direções e as
  # velocidades vêm do phrases.json; só o ID é escolha deste servidor.
  ids:
    andar: {frente: move_forward, trás: move_backward, direita: strafe_right, esquerda: strafe_left}
    virar: {direita: turn_right, esquerda: turn_left}
  verb_synonyms:
    # "ir" ficou de fora de propósito: no benchmark o Whisper ouviu "vira pra
    # esquerda" como "ir para a esquerda", e o robô andaria de lado em vez de virar.
    andar: [anda, ande, caminhar, caminha, caminhe, vai, vá]
    virar: [vira, vire, girar, gira, gire]
  direction_synonyms:
    frente: [adiante]
    trás: [atrás, ré]
    direita: []
    esquerda: []
  # Palavras de ligação ignoradas dentro de uma cláusula de movimento.
  ignore: [para, a, o, à, ao]
  # A go2-api só anda a partir de `balance_stand` (docs/essencial da go2-api).
  # O servidor manda essa postura antes de um movimento quando não sabe se o
  # robô já está nela. REVISAR com o robô: efeito com ele sentado ou deitado.
  prepare: {command: balance_stand, wait_s: 1.5}
  # Folga depois do fim do `move`, antes do próximo comando da fila.
  settle_s: 0.5

language:
  negation: [não, nunca, sem]
  separators: [e, depois, então, em seguida]
  replacements: {pra: para, pro: para o, pras: para as, pros: para os}
  # Removidos de qualquer cláusula antes de resolver.
  fillers: [por favor, robô, agora, aí, um pouco, um pouquinho]
