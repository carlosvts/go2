services:
  go2-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: go2-server:local
    container_name: go2-server
    profiles: ["server"]
    env_file: .env

    # Rede do host, como a go2-api: fala com ela por 127.0.0.1:8000 e escuta a
    # TV Box na porta 9000 do PC. Só funciona assim em Linux.
    network_mode: host

    volumes:
      # Modelos (Whisper e embeddings) baixados na primeira subida.
      - models:/models
      # Frases capturadas com GO2S_SAVE_UTTERANCES=1.
      - ./captures:/srv/captures
      # E-002: vozes do Piper (resposta falada), as mesmas de scripts/tts.py.
      - ./models/piper:/srv/models/piper:ro

    # Whisper na GPU: exige o NVIDIA Container Toolkit no host.
    gpus: all

    # Teto de CPU: a go2-api reenvia o `Move` a 40 Hz no mesmo PC e não pode
    # ficar sem processador durante uma transcrição. Ajuste ao hardware.
    cpus: 4.0
    restart: unless-stopped

  # E-002: Llama 3.1 8B Instruct Q4_K_M no llama.cpp oficial, processo separado,
  # todas as camadas na GPU. O go2-server fala com ele em 127.0.0.1:8080.
  # O arquivo .gguf não é versionado: coloque em ./models/llm/ (ver server/llm/generation.yaml).
  # Com Whisper e Llama juntos, confira a VRAM (`nvidia-smi`): caber em 8 GB é INFERIDO.
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: go2-llama-server
    profiles: ["server"]
    network_mode: host
    volumes:
      - ./models/llm:/models:ro
    command:
      - "-m"
      - "/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "999"
      - "--parallel"
      - "1"
      - "--ctx-size"
      - "2048"
    gpus: all
    restart: unless-stopped

volumes:
  models:
