services:
  go2-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: go2-server:local
    container_name: go2-server
    profiles: ["server"]
    env_file: .env

    # Rede do host, como a go2-api: fala com ela por 127.0.0.1:8000 e escuta a
    # TV Box na porta 9000 do PC. Só funciona assim em Linux.
    network_mode: host

    volumes:
      # Modelos (Whisper e embeddings) baixados na primeira subida.
      - models:/models
      # Frases capturadas com GO2S_SAVE_UTTERANCES=1.
      - ./captures:/srv/captures

    # Whisper na GPU: exige o NVIDIA Container Toolkit no host.
    gpus: all

    # Teto de CPU: a go2-api reenvia o `Move` a 40 Hz no mesmo PC e não pode
    # ficar sem processador durante uma transcrição. Ajuste ao hardware.
    cpus: 4.0
    restart: unless-stopped

  # E-002: Llama 3.1 8B Instruct Q4_K_M no llama.cpp oficial, processo separado,
  # todas as camadas na GPU. O go2-server fala com ele em 127.0.0.1:8080.
  # O arquivo .gguf não é versionado: coloque em ./models/llm/ (ver server/llm/generation.yaml).
  # Com Whisper e Llama juntos, confira a VRAM (`nvidia-smi`): caber em 8 GB é INFERIDO.
  # E-002: Piper em processo (container) próprio, com teto de CPU, para não
  # disputar processador com o go2-server (que interpreta a fala seguinte,
  # inclusive a parada) nem com a go2-api. Mesma imagem do go2-server.
  piper-tts:
    image: go2-server:local
    container_name: go2-piper-tts
    profiles: ["server"]
    network_mode: host
    volumes:
      # Vozes do Piper, as mesmas de scripts/tts.py.
      - ./models/piper:/srv/models/piper:ro
    command: ["uv", "run", "--frozen", "--no-dev", "--extra", "llm", "python", "-m",
              "app.reply.piper_service", "--voice", "/srv/models/piper/pt_BR-faber-medium.onnx",
              "--host", "127.0.0.1", "--port", "5002"]
    # Teto de CPU INFERIDO: ninguém mediu. Ajuste ao hardware do server.
    cpus: 1.0
    restart: unless-stopped

  llama-server:
    # Versão fixada (build b11749, ~2026-10-20) e digest: um pull entre sessões
    # não pode trocar o llama.cpp no meio do experimento (etapa 2 da E-002).
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11749@sha256:31b39eacce2bab5fde9286ec3980ed5548a3987644e94da0d0c2092f93313538
    container_name: go2-llama-server
    profiles: ["server"]
    network_mode: host
    volumes:
      - ./models/llm:/models:ro
    command:
      - "-m"
      - "/models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf"
      - "--host"
      - "127.0.0.1"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "999"
      - "--parallel"
      - "1"
      - "--ctx-size"
      - "2048"
    gpus: all
    restart: unless-stopped

volumes:
  models:
